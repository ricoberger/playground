---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-ingress
  namespace: flux-system
spec:
  interval: 15m
  path: ./homelab/kubernetes/istio-ingress
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  prune: true
  sourceRef:
    kind: GitRepository
    name: playground
  dependsOn:
    - name: base
