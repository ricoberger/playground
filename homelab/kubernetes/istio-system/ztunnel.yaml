---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  releaseName: ztunnel
  chart:
    spec:
      chart: ztunnel
      version: 1.32.0
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  driftDetection:
    mode: enabled
  interval: 15m
  timeout: 10m
  values:
    variant: "distroless"

    # Pod resource configuration
    resources:
      requests:
        cpu: 10m
        # Ztunnel memory scales with the size of the cluster and traffic load
        # While there are many factors, this is enough for ~200k pod cluster or
        # 100k concurrently open connections.
        memory: 64Mi

    # Configuration log level of ztunnel binary, default is info.
    # Valid values are: trace, debug, info, warn, error
    logLevel: info

    # To output all logs in json format
    logAsJson: true

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/instance: ztunnel
      app.kubernetes.io/name: ztunnel
  podMetricsEndpoints:
    - port: ztunnel-stats
      relabelConfigs:
        - source_labels: [__meta_kubernetes_pod_node_name]
          action: replace
          target_label: node
