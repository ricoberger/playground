---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-agent
rules:
  - apiGroups:
      - ""
    resources:
      - "pods"
      - "namespaces"
    verbs:
      - "get"
      - "watch"
      - "list"
  - apiGroups:
      - "apps"
    resources:
      - "replicasets"
    verbs:
      - "get"
      - "list"
      - "watch"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-agent
subjects:
  - kind: ServiceAccount
    name: otel-collector-agent
    namespace: observability

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-agent
  namespace: observability

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-agent
  namespace: observability
  labels:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            cors:
              allowed_origins:
              - http://*
              - https://*
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
        storage: file_storage
        include_file_path: true
        include_file_name: false
        operators:
          - id: container_parser
            type: container
            on_error: send_quiet
            output: json_parser
          - id: json_parser
            type: json_parser
            on_error: send_quiet
            output: time_parser_router
          - id: time_parser_router
            type: router
            default: trace_parser
            routes:
              - output: time_parser
                expr: 'attributes.time != nil'
          - id: time_parser
            type: time_parser
            parse_from: attributes.time
            layout: '%Y-%m-%dT%H:%M:%S.%LZ'
            on_error: send_quiet
            output: trace_parser
          - id: trace_parser
            type: trace_parser
            on_error: send_quiet
            trace_id:
              parse_from: attributes.trace_id
            span_id:
              parse_from: attributes.span_id
            trace_flags:
              parse_from: attributes.trace_flags
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_http:
            endpoint: 0.0.0.0:14268
      zipkin:
        endpoint: 0.0.0.0:9411

    exporters:
      otlphttp/victoriametrics:
        compression: gzip
        encoding: proto
        metrics_endpoint: http://vminsert-vmcluster.observability.svc.cluster.local:8480/insert/0/opentelemetry/v1/metrics
        tls:
          insecure: true
      otlphttp/victorialogs:
        compression: gzip
        encoding: proto
        logs_endpoint: http://vlinsert-vlcluster.observability.svc.cluster.local:9481/insert/opentelemetry/v1/logs
        tls:
          insecure: true
        headers:
          VL-Msg-Field: body
      otlphttp/victorialogs/filelog:
        compression: gzip
        encoding: proto
        logs_endpoint: http://vlinsert-vlcluster.observability.svc.cluster.local:9481/insert/opentelemetry/v1/logs
        tls:
          insecure: true
        headers:
          VL-Msg-Field: body
          # Comma-separated list of log field names, which uniquely identify
          # every log stream.
          #
          # Overwrite the default setting which includes all
          # "resource.attributes" fields.
          VL-Stream-Fields: "service.name,service.namespace,k8s.namespace.name,k8s.node.name,k8s.pod.name,k8s.pod.uid,k8s.container.name"
      otlphttp/victoriatraces:
        compression: gzip
        encoding: proto
        traces_endpoint: http://vtinsert-vtcluster.observability.svc.cluster.local:10481/insert/opentelemetry/v1/traces
        tls:
          insecure: true

    processors:
      batch:
        send_batch_size: 10000
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
          passthrough: false
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
            - sources:
                - from: connection
          extract:
            metadata:
              - k8s.namespace.name
              - k8s.node.name
              - k8s.pod.name
              - k8s.pod.uid
              - k8s.container.name
            labels:
              - tag_name: app
                key_regex: app
                from: pod
              - tag_name: k8s-app
                key_regex: k8s-app
                from: pod
              - tag_name: app.kubernetes.io/name
                key_regex: app.kubernetes.io\/name
                from: pod
      deltatocumulative:
        max_stale: 5m
      transform/logs/filelog:
        error_mode: silent
        log_statements:
          # Set service.name from Kubernetes labels or the container name if not
          # already set. The fields are deleted afterwards to avoid sending
          # redundant information.
          - context: log
            conditions:
              - IsMap(resource.attributes)
            statements:
              - set(resource.attributes["service.name"], resource.attributes["k8s.pod.labels.app"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.labels.app"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.pod.labels.k8s-app"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.labels.k8s-app"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.pod.labels.app.kubernetes.io/name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.pod.labels.app.kubernetes.io/name"] != nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.container.name"] != nil
              - delete_key(resource.attributes, "k8s.pod.labels.app")
              - delete_key(resource.attributes, "k8s.pod.labels.k8s-app")
              - delete_key(resource.attributes, "k8s.pod.labels.app.kubernetes.io/name")
          # Set service.namespace from Kubernetes namespace if not already set
          - context: log
            conditions:
              - IsMap(resource.attributes) and resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"] != nil
            statements:
              - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"])
          # Set severity from severity / level field if the corresponding field
          # exists. The fields are deleted afterwards to avoid sending redundant
          # information.
          - context: log
            conditions:
              - IsMap(log.attributes)
            statements:
              - set(log.severity_text, log.attributes["level"]) where log.attributes["level"] != nil
              - set(log.severity_text, log.attributes["severity"]) where log.attributes["severity"] != nil
              - set(log.severity_text, log.attributes["severity_text"]) where log.attributes["severity_text"] != nil
              - delete_key(log.attributes, "level")
              - delete_key(log.attributes, "severity")
              - delete_key(log.attributes, "severity_text")
          # Set body from msg / message / body with clear precedence. Preserve
          # the original fields, when they are not used for the body field, to
          # avoid losing information.
          - context: log
            conditions:
              - IsMap(log.attributes)
            statements:
              - set(log.body, log.attributes["msg"]) where log.attributes["msg"] != nil and IsString(log.attributes["msg"])
              - set(log.body, log.attributes["message"]) where log.attributes["msg"] == nil and log.attributes["message"] != nil and IsString(log.attributes["message"])
              - set(log.body, log.attributes["body"]) where log.attributes["msg"] == nil and log.attributes["message"] == nil and log.attributes["body"] != nil and IsString(log.attributes["body"])
              - delete_key(log.attributes, "msg") where log.attributes["msg"] != nil and IsString(log.attributes["msg"])
              - delete_key(log.attributes, "message") where log.attributes["msg"] == nil and log.attributes["message"] != nil and IsString(log.attributes["message"])
              - delete_key(log.attributes, "body") where log.attributes["msg"] == nil and log.attributes["message"] == nil and log.attributes["body"] != nil and IsString(log.attributes["body"])
          # Parse traceparent (e.g. 00-6ac7dfc54b57c09403006ad060449762-a300e6b481aa1c09-01)
          # from Istio logs.
          - context: log
            conditions:
              - IsMap(resource.attributes) and resource.attributes["k8s.container.name"] == "istio-proxy"
            statements:
              - set(attributes["trace-id"], Substring(attributes["traceparent"], 3, 32))
              - set(attributes["span-id"], Substring(attributes["traceparent"], 36, 16))
              - set(trace_id.string, attributes["trace-id"])
              - set(span_id.string, attributes["span-id"])
              - delete_key(attributes, "trace-id")
              - delete_key(attributes, "span-id")
      transform/traces:
        error_mode: silent
        trace_statements:
          - context: span
            statements:
              - set(resource.attributes["service.name_original"], resource.attributes["service.name"])
          - context: span
            statements:
              - replace_pattern(name, "\\?.*", "")
              - replace_match(name, "GET /api/products/*", "GET /api/products/{productId}")

    extensions:
      file_storage:
        directory: /var/lib/otel-collector-agent
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    connectors:
      spanmetrics: {}

    service:
      telemetry:
        logs:
          encoding: json
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

      extensions:
        - file_storage
        - health_check
        - zpages

      pipelines:
        metrics:
          receivers:
            - otlp
            - spanmetrics
          processors:
            - memory_limiter
            - batch
            - k8sattributes
            - deltatocumulative
          exporters:
            - otlphttp/victoriametrics
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
            - k8sattributes
          exporters:
            - otlphttp/victorialogs
        logs/filelog:
          receivers:
            - filelog
          processors:
            - memory_limiter
            - batch
            - k8sattributes
            - transform/logs/filelog
          exporters:
            - otlphttp/victorialogs/filelog
        traces:
          receivers:
            - otlp
            - jaeger
            - zipkin
          processors:
            - memory_limiter
            - batch
            - k8sattributes
            - transform/traces
          exporters:
            - otlphttp/victoriatraces
            - spanmetrics

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-agent
  namespace: observability
  labels:
    app: otel-collector-agent
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
      appProtocol: http
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
    - name: jaeger-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
      appProtocol: grpc
    - name: jaeger-thrift
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: zipkin
      port: 9411
      targetPort: 9411
      protocol: TCP
  selector:
    app: otel-collector-agent

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: observability
  labels:
    app: otel-collector-agent
spec:
  selector:
    matchLabels:
      app: otel-collector-agent
  template:
    metadata:
      labels:
        app: otel-collector-agent
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: otel-collector-agent
      automountServiceAccountToken: true
      # The upstream image runs as UID 10001, but the filelog receiver needs root
      # to read /var/log/pods and to write its checkpoints to the hostPath
      # /var/lib/otel-collector-agent, which is created as root:root 0755.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      imagePullSecrets:
        - name: staffbase-registries
      containers:
        - name: otel-collector-agent
          image: otel/opentelemetry-collector-contrib:0.165.0
          imagePullPolicy: Always
          args:
            - --config=/otel-collector/config/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: zpages
              containerPort: 55679
              protocol: TCP
            - name: jaeger-compact
              containerPort: 6831
              protocol: UDP
            - name: jaeger-grpc
              containerPort: 14250
              protocol: TCP
            - name: jaeger-thrift
              containerPort: 14268
              protocol: TCP
            - name: zipkin
              containerPort: 9411
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: health
          env:
            # 75% of the configured memory limit
            - name: GOMEMLIMIT
              value: 384MiB
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: filestorage
              mountPath: /var/lib/otel-collector-agent
            - name: config
              mountPath: /otel-collector/config
      tolerations:
        - operator: Exists
      volumes:
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - hostPath:
            path: /var/lib/otel-collector-agent
            type: DirectoryOrCreate
          name: filestorage
        - configMap:
            name: otel-collector-agent
            items:
              - key: config.yaml
                path: config.yaml
          name: config

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: otel-collector-agent
  namespace: observability
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: otel-collector-agent
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
        - source_labels: [__meta_kubernetes_pod_node_name]
          action: replace
          target_label: node
