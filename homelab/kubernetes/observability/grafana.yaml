---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
  - nonResourceURLs:
      - "*"
    verbs:
      - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: observability

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: observability
data:
  apps.yaml: |
    apiVersion: 1

    apps:
      - type: ricoberger-kubernetes-app
        org_id: 1
        org_name: Main Org.
        disabled: false

---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
spec:
  version: grafana/grafana:13.3.0
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  deployment:
    spec:
      replicas: 1
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      key: GF_SECURITY_ADMIN_USER
                      name: grafana-credentials
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: GF_SECURITY_ADMIN_PASSWORD
                      name: grafana-credentials
                - name: GF_RENDERING_RENDERER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: GF_RENDERING_RENDERER_TOKEN
                      name: grafana-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 10001
                runAsNonRoot: true
                runAsUser: 10001
                seccompProfile:
                  type: "RuntimeDefault"
              volumeMounts:
                - mountPath: /etc/grafana/provisioning/plugins/apps.yaml
                  name: grafana-provisioning
                  subPath: apps.yaml
            - name: image-renderer
              image: "grafana/grafana-image-renderer:v5.12.10"
              env:
                - name: AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: GF_RENDERING_RENDERER_TOKEN
                      name: grafana-credentials
            - name: kubernetes-plugin
              image: alpine/curl:8.23.0
              command:
                - /bin/sh
                - -c
                - |
                  while :; do
                    # curl -X GET -u "$GF_SECURITY_ADMIN_USER:$GF_SECURITY_ADMIN_PASSWORD" -Lw '{"code": "%{http_code}", "time": "%{time_total}"}\n' -s -o /dev/null 'http://localhost:3000/api/datasources/uid/kubernetes/health'
                    curl -X GET -u "$GF_SECURITY_ADMIN_USER:$GF_SECURITY_ADMIN_PASSWORD" -L -s -o /dev/null 'http://localhost:3000/api/datasources/uid/kubernetes/health'
                    sleep 5
                  done
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      key: GF_SECURITY_ADMIN_USER
                      name: grafana-credentials
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: GF_SECURITY_ADMIN_PASSWORD
                      name: grafana-credentials
              readinessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - echo "Ready"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 65534
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: "RuntimeDefault"
          topologySpreadConstraints:
            - labelSelector:
                matchLabels:
                  app: grafana
              maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
          volumes:
            - configMap:
                defaultMode: 420
                name: grafana-provisioning
              name: grafana-provisioning
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  disableDefaultAdminSecret: true
  config:
    log:
      mode: console
      level: debug
    log.console:
      format: json
    tracing.opentelemetry.otlp:
      address: otel-collector-agent.observability.svc.cluster.local:4317
    users:
      auto_assign_org_role: Editor
    auth.anonymous:
      enabled: "false"
    server:
      root_url: https://grafana.homelab.ricoberger.dev
    unified_alerting:
      enabled: "true"
    unified_alerting.screenshots:
      capture: "true"
    unified_alerting.state_history:
      enabled: "true"
      backend: prometheus
      prometheus_target_datasource_uid: victoriametrics
    rendering:
      server_url: http://localhost:8081/render
    plugins:
      plugin_admin_enabled: "false"
      allow_loading_unsigned_plugins: ricoberger-cloudflare-datasource,ricoberger-istio-datasource,ricoberger-kubernetes-app,ricoberger-kubernetes-datasource
      forward_host_env_vars: ricoberger-cloudflare-datasource,ricoberger-istio-datasource,ricoberger-kubernetes-app,ricoberger-kubernetes-datasource,victoriametrics-logs-datasource,victoriametrics-metrics-datasource
      preinstall_sync: grafana-pyroscope-app,ricoberger-cloudflare-datasource@0.6.0@https://github.com/ricoberger/grafana-cloudflare-plugin/releases/download/v0.6.0/ricoberger-cloudflare-datasource-0.6.0.zip,ricoberger-istio-datasource@0.3.0@https://github.com/ricoberger/grafana-istio-plugin/releases/download/v0.3.0/ricoberger-istio-datasource-0.3.0.zip,ricoberger-kubernetes-app@0.7.0@https://github.com/ricoberger/grafana-kubernetes-plugin/releases/download/v0.7.0/ricoberger-kubernetes-app-0.7.0.zip,victoriametrics-logs-datasource,victoriametrics-metrics-datasource

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
  hostnames:
    - "grafana.homelab.ricoberger.dev"
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000

---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: grafana
  namespace: observability
spec:
  endpoints:
    - dnsName: grafana.homelab.ricoberger.dev
      recordTTL: 300
      recordType: A
      targets:
        - ${ipaddress}

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: grafana
  namespace: observability
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: grafana
  podMetricsEndpoints:
    - port: grafana-http
